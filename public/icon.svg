<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021a14" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Geometric Border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.35" />

  <!-- Central Emblem: Islamic Eight-Pointed Star / Quran Stand / Calligraphy -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Rotating Octagram / Rub el Hizb -->
    <rect x="-120" y="-120" width="240" height="240" rx="28" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-opacity="0.5" />
    <rect x="-120" y="-120" width="240" height="240" rx="28" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-opacity="0.5" transform="rotate(45)" />

    <!-- Center Filled Badge -->
    <circle r="92" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6" />

    <!-- Arabic Calligraphy "إ" (Iqra / Islam) -->
    <text x="0" y="32" font-family="'Amiri', 'Cinzel', serif" font-size="118" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" dominant-baseline="central">
      إ
    </text>
  </g>
</svg>
